name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache-bust assets
        run: |
          HASH=$(cat app/styles/styles.css app/scripts/store.js app/scripts/api.js app/scripts/ui.js app/scripts/app.js | sha256sum | cut -c1-12)
          sed -i "s/__CACHE_BUST__/$HASH/g" app/*.html
      - name: Set code repo link
        run: |
          sed -i "s|__CODE_REPO_LINK_PLACEHOLDER__|https://github.com/kuwii/super-simple-chat|g" app/*.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
