<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Simple Chat</title>
  <link rel="icon" href="data:,">
  <script>
    /**
     * 首屏防闪烁：渲染前应用主题（优先级：已保存偏好 > 系统/浏览器偏好 > 亮色）。
     * @returns {void}
     */
    (function () {
      var theme = null;
      try {
        var t = localStorage.getItem('ssc.theme');
        if (t === 'light' || t === 'dark') theme = t;
      } catch (e) { /* 隐私模式等：localStorage 不可用 */ }
      if (!theme && window.matchMedia) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <script>
    /* 可选的 code repo 链接（将占位符替换为真实地址） */
    window.code_repo_link = '__CODE_REPO_LINK_PLACEHOLDER__';
  </script>
  <link rel="stylesheet" href="styles/styles.css?v=__CACHE_BUST__">
</head>
<body>
  <div id="app"></div>
  <!-- 加载顺序：store.js → api.js → markdown.js → ui.js → app.js -->
  <!-- 使用普通 script（非 ES module） -->
  <script src="scripts/store.js?v=__CACHE_BUST__"></script>
  <script src="scripts/api.js?v=__CACHE_BUST__"></script>
  <script src="scripts/markdown.js?v=__CACHE_BUST__"></script>
  <script src="scripts/ui.js?v=__CACHE_BUST__"></script>
  <script src="scripts/app.js?v=__CACHE_BUST__"></script>
</body>
</html>
